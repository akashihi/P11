# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml

esphome:
  name: panasonic-cn-cnt
  name_add_mac_suffix: false
  friendly_name: Panasonic CN-CNT

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  source: github://DomiStyle/esphome-panasonic-ac
  components: [panasonic_ac]
  
logger:
  level: DEBUG
  
api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Panasonic CN-CN Fallback Hotspot
    password: !secret fallback_ap_password
  output_power: 20dB
  power_save_mode: none
  fast_connect: false
  reboot_timeout: 5min

captive_portal:

ota:
- platform: esphome
  password: !secret ota_password

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  id: ac_uart
  baud_rate: 9600
  parity: EVEN  

switch:
  - platform: restart
    name: "Panasonic CN-CNT Restart"  

climate:
  - platform: panasonic_ac
    id: office
    type: cnt
    name: "Panasonic CN-CNT"
    vertical_swing_select:
      name: "Panasonic CN-CNT Vertical Swing Mode"
    outside_temperature:
      name: "Panasonic CN-CNT Outside Temperature"
    defrost_sensor:
      name: "Panasonic CN-CNT Defrost Status"
    current_power_consumption:
      id: power_consumption_office
      name: "Panasonic CN-CNT Power Consumption"
      unit_of_measurement: W
      accuracy_decimals: 0
      device_class: power
      state_class: measurement    

sensor:
  - platform: total_daily_energy
    name: "Panasonic CN-CNT Total Daily Energy"
    power_id: power_consumption_office
    filters:
        - multiply: 0.001
    unit_of_measurement: kWh
    device_class: energy
  - platform: dallas_temp
    name: temperature
    update_interval: 120s

time:
  - platform: homeassistant
    id: my_time      

one_wire:
  - platform: gpio
    pin: GPIO1

